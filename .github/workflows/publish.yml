# Publishes the library. One repository, no keys.
#
# An earlier version copied the built files into a second repository, which
# needed a personal access token because GitHub does not let one repo write to
# another. That existed only because this repo was private. It is not, so the
# whole apparatus goes: the site reads this repository directly.
#
# What this does on every push to main:
#   - runs the gates. tools/audit.py blocks hidden content and malformed skills;
#     tools/package.py extracts each archive to a scratch directory and runs that
#     skill's own test suite from inside it.
#   - checks catalogue.json and README.md are what the sources produce, and
#     fails if not. CI never writes to this repository, so a publish never puts
#     a commit on main and a push from a laptop is never rejected.
#   - attaches the skill archives and the sample datasets to the "latest" release
#
# Nothing is published unless the gates pass, so a failure leaves the site
# serving the previous release. Stale beats broken.
#
# Where the site reads from -- both are public, permanent, and need no token:
#   catalogue   https://raw.githubusercontent.com/thomashugnet-netizen/skills-os/main/catalogue.json
#   a download  https://github.com/thomashugnet-netizen/skills-os/releases/latest/download/<file>
#
# GITHUB_TOKEN below is issued by GitHub to this workflow automatically. There is
# nothing to create and nothing to store.

name: publish

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "data/**"
      - "tools/**"
      - "roadmap.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  # Needed to create the release. Nothing here pushes a commit.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/catalogue.py reads commit dates to say when each skill last
          # changed, so a shallow clone would report the whole library as
          # updated today.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Audit
        run: python3 tools/audit.py

      - name: Package every skill, running its tests from inside its archive
        run: python3 tools/package.py

      # CI verifies; it does not write. An earlier version regenerated these and
      # committed them back, which put a commit on main after every publish --
      # so the next push from a laptop was rejected, every single time, and the
      # conflict was always in a generated file. Checking instead means the
      # committed catalogue is provably what the sources produce, and nobody
      # ever has to pull before pushing.
      - name: Check the catalogue and README are current
        run: |
          python3 tools/catalogue.py
          python3 tools/gen_readme.py
          if ! git diff --quiet catalogue.json README.md; then
            echo "::error::catalogue.json or README.md is out of date."
            echo "Run these and commit the result:"
            echo "  python3 tools/catalogue.py && python3 tools/gen_readme.py"
            git --no-pager diff --stat catalogue.json README.md
            exit 1
          fi
          echo "Both current."

      - name: Assemble what may be published
        run: python3 tools/site_assets.py

      - name: Publish the downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One moving tag. Every download URL stays valid forever, because the
          # site links to /releases/latest/download/<file> and never to a version.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Current library" \
            --notes "Built from ${GITHUB_SHA}. Downloads here are what catalogue.json describes." \
            $(find dist/site-assets -type f ! -name catalogue.json)
