# Publishes the library to the site's repository.
#
# The site used to be fed by hand: someone rebuilt the packages, zipped them up,
# dragged the folder into Replit, and hoped they had not forgotten a file. That
# lasted exactly as long as nothing changed. This removes the geste entirely --
# push to this repo and the site's copy follows, or nothing moves at all.
#
# Nothing is published unless the gates pass. tools/audit.py blocks hidden
# content and malformed skills; tools/package.py extracts each archive to a
# scratch directory and runs that skill's own test suite from inside it. A
# failure here leaves the site serving the previous version, which is the
# correct outcome: stale beats broken.
#
# One-time setup
# --------------
# This workflow needs permission to write to the site's repository, which
# GitHub does not grant across repos by default.
#
#   1. Create a fine-grained personal access token
#      (github.com/settings/personal-access-tokens/new):
#        - Repository access: only SITE_REPO below
#        - Permissions: Contents -> Read and write
#   2. In THIS repository: Settings -> Secrets and variables -> Actions
#        - New repository secret, named SITE_REPO_TOKEN, paste the token
#
# The token works whether either repository is public or private, so opening
# this one up later changes nothing here.

name: publish

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "data/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  SITE_REPO: thomashugnet-netizen/skills-os-site
  # Where the assets land inside the site's repository. One line to change if
  # the site serves its static files from somewhere else.
  DEST_DIR: site-assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          # tools/catalogue.py reads commit dates to work out when each skill
          # last changed, so a shallow clone would report the whole library as
          # updated today.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Audit
        run: python3 tools/audit.py

      - name: Package every skill, running each one's tests from its archive
        run: python3 tools/package.py

      - name: Build the catalogue
        run: python3 tools/catalogue.py

      - name: Assemble what the site may serve
        run: python3 tools/site_assets.py

      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site-repo

      - name: Copy the assets across
        run: |
          rm -rf "site-repo/${DEST_DIR}"
          mkdir -p "site-repo/${DEST_DIR}"
          cp -R dist/site-assets/. "site-repo/${DEST_DIR}/"

      - name: Commit, but only if something actually changed
        working-directory: site-repo
        run: |
          git config user.name  "skills-os publisher"
          git config user.email "noreply@github.com"
          git add -A "${DEST_DIR}"
          if git diff --cached --quiet; then
            echo "Nothing changed. Not pushing an empty commit."
            exit 0
          fi
          SUMMARY=$(python3 -c "import json;c=json.load(open('../dist/catalogue.json'))['library'];d=json.load(open('../dist/catalogue.json'))['datasets'];print(f\"{c['available']} available of {c['skills']} skills, {len(d)} sample datasets\")")
          git commit -m "Publish library: ${SUMMARY}" \
                     -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
                     -m "Generated by .github/workflows/publish.yml. Do not edit ${DEST_DIR}/ by hand -- the next publish overwrites it."
          git push
