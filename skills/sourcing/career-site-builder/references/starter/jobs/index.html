<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search jobs | Northline Fuel &amp; Market careers</title>
<meta name="description" content="Search every open Northline job by role, city or ZIP code. Pay and schedule are listed on every job, and most applications take about five minutes.">
<link rel="canonical" href="https://careers.example.com/jobs/index.html">
<meta property="og:title" content="Search jobs at Northline Fuel &amp; Market">
<meta property="og:description" content="Pay and schedule on every listing. Apply from your phone.">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"></header>
<main id="main">
  <section class="job-head">
    <div class="wrap">
      <h1>Search jobs</h1>
      <p class="lead">Every listing shows the pay and the schedule. Filter by what you want to do and where you can get to.</p>
      <form class="search search--row" id="job-search" action="index.html" method="get" role="search" aria-label="Filter jobs">
        <div>
          <label for="q">Job or keyword</label>
          <input id="q" name="q" type="text" placeholder="Cashier, cook, driver..." autocomplete="off">
        </div>
        <div>
          <label for="where">City or ZIP code</label>
          <input id="where" name="where" type="text" placeholder="Atlanta, 30303..." autocomplete="postal-code">
        </div>
        <div>
          <label for="cat">Career area</label>
          <select id="cat" name="cat">
            <option value="">All areas</option>
            <option value="store-teams">Store teams</option>
            <option value="food-service">Food service</option>
            <option value="store-leadership">Store leadership</option>
            <option value="distribution">Distribution and driving</option>
            <option value="maintenance">Maintenance and trades</option>
            <option value="corporate">Office and corporate</option>
          </select>
        </div>
        <button class="btn btn--primary" type="submit">Search</button>
      </form>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <p class="status" id="job-status" aria-live="polite">All open jobs are listed below.</p>
      <ol class="job-list" id="job-results"></ol>
    </div>
  </section>
</main>
<footer class="site-footer"></footer>
<script src="jobs.js"></script>
<script src="../js/site.js" defer></script>
</body>
</html>
